# ═══════════════════════════════════════════════════════════════════════════
#  hyprlock — ekran kilidi
#  Palet: Catppuccin Mocha (bkz. hypr/lua/theme.lua)
#
#  Not: Bu dosya hyprlang biçimindedir. Kullanımdan kaldırılan şey Hyprland'in
#  KENDİ hyprland.conf'u; hyprlock/hypridle/hyprpaper hâlâ hyprlang kullanır.
#
#  Parola alanını temizleme kısayolları: ESC, Ctrl+U, Ctrl+Backspace
# ═══════════════════════════════════════════════════════════════════════════

$font = JetBrainsMono Nerd Font

# --- Catppuccin Mocha -------------------------------------------------------
$base     = rgba(1e1e2eff)
$mantle   = rgba(181825ff)
$crust    = rgba(11111bff)
$surface0 = rgba(313244ff)
$surface1 = rgba(45475aff)
$text     = rgba(cdd6f4ff)
$subtext0 = rgba(a6adc8ff)
$blue     = rgba(89b4faff)
$mauve    = rgba(cba6f7ff)
$green    = rgba(a6e3a1ff)
$red      = rgba(f38ba8ff)

general {
    hide_cursor           = true
    ignore_empty_input    = true
    # Yanlış parolada tüm ekranlarda aynı hata gösterilsin.
    fail_timeout          = 2000
}

auth {
    pam {
        enabled = true
    }
}

animations {
    enabled = true
    bezier    = linear, 1, 1, 0, 0
    animation = fadeIn,  1, 3, linear
    animation = fadeOut, 1, 3, linear
    animation = inputFieldDots, 1, 2, linear
}

# --- Arka plan --------------------------------------------------------------
# Duvar kağıdını bulanıklaştırarak kullanır. Sabit bir görsel isterseniz
# path satırını bir dosya yoluyla değiştirin.
#
# Yol notu: hyprlang'ın $DEĞİŞKEN sözdizimi ortam değişkeni DEĞİL, dosya içinde
# tanımlanan değişkenlerdir; bu yüzden $HOME burada güvenilir değildi. Kurulum
# betiği aşağıdaki satırı gerçek mutlak yol ile yeniden yazar (setup_paths).
background {
    monitor      =
    path         = ~/.config/hypr/wallpaper/wallpaper.jpg
    blur_passes  = 3
    blur_size    = 8
    noise        = 0.0117
    contrast     = 0.9
    brightness   = 0.75
    vibrancy     = 0.17
}

# --- Parola alanı -----------------------------------------------------------
input-field {
    monitor          =
    size             = 320, 52
    outline_thickness = 2
    dots_size        = 0.28
    dots_spacing     = 0.3
    dots_center      = true

    outer_color      = $surface1
    inner_color      = $mantle
    font_color       = $text
    check_color      = $blue
    fail_color       = $red

    fade_on_empty    = false
    rounding         = 12

    font_family      = $font
    placeholder_text = <span foreground="##a6adc8">Parola</span>
    fail_text        = <span foreground="##f38ba8">$FAIL ($ATTEMPTS)</span>
    check_text       = <span foreground="##89b4fa">Doğrulanıyor...</span>

    position         = 0, -80
    halign           = center
    valign           = center
}

# --- Saat -------------------------------------------------------------------
label {
    monitor     =
    text        = cmd[update:1000] date +"%H:%M"
    color       = $text
    font_size   = 110
    font_family = $font

    position    = 0, 220
    halign      = center
    valign      = center
}

# --- Tarih ------------------------------------------------------------------
label {
    monitor     =
    text        = cmd[update:60000] date +"%d %B %Y, %A"
    color       = $subtext0
    font_size   = 18
    font_family = $font

    position    = 0, 130
    halign      = center
    valign      = center
}

# --- Kullanıcı --------------------------------------------------------------
label {
    monitor     =
    text        = $USER
    color       = $text
    font_size   = 16
    font_family = $font

    position    = 0, -30
    halign      = center
    valign      = center
}

# --- Klavye düzeni ----------------------------------------------------------
# Parolanızı yanlış düzende yazmayı önler.
label {
    monitor     =
    text        = $LAYOUT
    color       = $subtext0
    font_size   = 14
    font_family = $font

    position    = 0, -150
    halign      = center
    valign      = center
}

# --- Pil durumu -------------------------------------------------------------
# BAT0 SABİT YAZILMAZ: pilin adı her makinede aynı değildir (birçok ThinkPad
# ve bazı Dell modellerinde BAT1, ikinci pilli makinelerde BAT0+BAT1). Glob
# ile ilk bulunan pil okunuyor. Masaüstünde hiç pil yoktur → değişken boş
# kalır ve etiket hiç çizilmez; "--%" gibi anlamsız bir metin görünmez.
label {
    monitor     =
    text        = cmd[update:30000] c=$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -n1); [ -n "$c" ] && printf "%s%%" "$c"
    color       = $subtext0
    font_size   = 14
    font_family = $font

    position    = -30, -20
    halign      = right
    valign      = top
}

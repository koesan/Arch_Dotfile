# ═══════════════════════════════════════════════════════════════════════════
#  hypridle — boşta kalma yöneticisi
#  Arch_Dotfile · https://github.com/koesan/Arch_Dotfile
#
#  Zincir (kahve KAPALIYKEN):
#     4.5 dk → ekranı karart (uyarı)      5 dk +10sn → ekranı kapat (DPMS off)
#     5   dk → kilitle                  15 dk       → uykuya al (yalnızca pilde)
#
#  Kahve AÇIKKEN: hiçbiri çalışmaz. Ekran kararmaz, kilitlenmez, uyumaz.
#  Panelde 󰅶 (sarı) = açık, 󰾪 (gri) = kapalı.
#
#  KAHVE NASIL ÇALIŞIR — her listener'daki `condition_cmd` satırı
#  $XDG_RUNTIME_DIR/caffeine dosyasına bakar. Dosya varsa komut sıfırdan
#  farklı döner ve hypridle o eylemi çalıştırmaz (`on-resume` de atlanır).
#  Dosyayı ~/.local/bin/caffeine yazar; waybar'daki 󰅶 düğmesi onu çağırır.
#
#  Neden waybar'ın yerleşik `idle_inhibitor` modülü kullanılmıyor?
#  O modül durumu yalnızca bellekte tutar: waybar her yeniden başladığında
#  (config değişikliği, oturum açılışı, `killall waybar`) sessizce kapalıya
#  döner. Kullanıcı açık sanırken ekran kararırdı. Dosya tabanlı anahtar
#  waybar'dan bağımsız yaşar. Betik ayrıca bir systemd `idle:sleep` kilidi de
#  tutar; hypridle bunu ayrıca izler, yani tek bir katman atlansa bile
#  makine uyanık kalır.
#
#  Not: Bu dosya hyprlang biçimindedir (Hyprland'in kendisi Lua'ya geçti,
#  hypridle/hyprlock/hyprpaper geçmedi).
#
#  Denemek için:  hyprctl dispatch exec "loginctl lock-session"
# ═══════════════════════════════════════════════════════════════════════════

general {
    # loginctl lock-session (ör. wlogout, systemd) bu komutu çalıştırır.
    # -q: hyprlock zaten çalışıyorsa ikinci bir örnek başlatma.
    lock_cmd = pidof hyprlock || hyprlock

    # Uykuya girmeden ÖNCE kilitle. Kapağı kapatıp açan biri parolasız
    # masaüstüne düşmesin diye şart.
    before_sleep_cmd = loginctl lock-session

    # Uyanınca ekranı geri aç (bazı sürücülerde DPMS kapalı kalıyor).
    after_sleep_cmd = hyprctl dispatch dpms on

    # Tarayıcı/oyun "beni uyutma" derse dinle (video izlerken kilitlenmesin).
    # ignore_wayland_inhibit da varsayılan olarak false: tam ekran video
    # oynatan pencereler (bkz. hypr/lua/rules.lua) sayacı kendiliğinden durdurur.
    ignore_dbus_inhibit    = false
    ignore_systemd_inhibit = false
}

# ── 4.5 dk: ekranı karart ──────────────────────────────────────────────────
# Kilitten 30 sn önce gelen görsel uyarı: fareyi oynatınca eski parlaklığa
# döner. Eski sürüm `set 10` yazıyordu — bu YÜZDE değil ham değerdir (65535
# üzerinden 10), yani ekran uyarı vermek yerine tamamen kararıyordu.
listener {
    timeout       = 270
    condition_cmd = test ! -e "${XDG_RUNTIME_DIR:-/run/user/$(id -u)}/caffeine"
    on-timeout    = brightnessctl -s set 10%
    on-resume     = brightnessctl -r
}

# ── 4.5 dk: klavye aydınlatmasını kapat ────────────────────────────────────
# Cihaz yoksa komut sessizce başarısız olur, sorun çıkarmaz.
listener {
    timeout       = 270
    condition_cmd = test ! -e "${XDG_RUNTIME_DIR:-/run/user/$(id -u)}/caffeine"
    on-timeout    = brightnessctl -sd rgb:kbd_backlight set 0
    on-resume     = brightnessctl -rd rgb:kbd_backlight
}

# ── 5 dk: kilitle ──────────────────────────────────────────────────────────
listener {
    timeout       = 300
    condition_cmd = test ! -e "${XDG_RUNTIME_DIR:-/run/user/$(id -u)}/caffeine"
    on-timeout    = loginctl lock-session
}

# ── 5 dk + 10 sn: ekranı kapat ─────────────────────────────────────────────
# Kilitle aynı saniyede kapatılmıyor: hyprlock'un yüzeyi henüz çizilmemişken
# DPMS kapanırsa bazı sürücülerde ekran uyandığında bir an kilitsiz masaüstü
# görünüyor. 10 sn'lik pay bunu ortadan kaldırır; kullanıcı açısından ekran
# yine "5 dakikada" kapanmış olur.
listener {
    timeout       = 310
    condition_cmd = test ! -e "${XDG_RUNTIME_DIR:-/run/user/$(id -u)}/caffeine"
    on-timeout    = hyprctl dispatch dpms off
    on-resume     = hyprctl dispatch dpms on
}

# ── 15 dk: uykuya al (yalnızca pilde) ──────────────────────────────────────
# Prize takılıyken uyutmak indirme/derleme gibi işleri keseceği için istenmez.
# Koşul on-timeout içinde de tekrarlanıyor: `condition_cmd` kahve anahtarına,
# buradaki test güç kaynağına bakar.
# Masaüstünde AC dosyası hiç yoktur → koşul sağlanmaz → uyutmaz. İstenen bu.
listener {
    timeout       = 900
    condition_cmd = test ! -e "${XDG_RUNTIME_DIR:-/run/user/$(id -u)}/caffeine"
    on-timeout    = sh -c 'test "$(cat /sys/class/power_supply/A*/online 2>/dev/null | head -n1)" = "0" && systemctl suspend'
}

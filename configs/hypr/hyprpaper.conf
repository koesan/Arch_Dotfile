# ═══════════════════════════════════════════════════════════════════════════
#  hyprpaper — duvar kağıdı
#  Arch_Dotfile · https://github.com/koesan/Arch_Dotfile
#
#  Not: hyprpaper hyprlang biçimini kullanır (Hyprland'in kendisi Lua'ya
#  geçti, yardımcı araçlar geçmedi).
#
#  monitor alanı BOŞ bırakıldı: kural bağlı olan TÜM ekranlara uygulanır.
#  Eskiden burada eDP-1 ve HDMI-A-1 adları sabitti; o ekranlara sahip
#  olmayan bir bilgisayarda duvar kağıdı hiç görünmüyordu.
#
#  Yolda ~ genişletmesi hyprpaper tarafından yapılır; yine de kurulum betiği
#  bu satırları gerçek $HOME ile yeniden yazar (setup_paths fonksiyonu).
#
#  Duvar kağıdını değiştirmek için dosyayı bu yola kopyalamanız yeterli:
#      cp resminiz.jpg ~/.config/hypr/wallpaper/wallpaper.jpg
#      hyprctl hyprpaper reload ,~/.config/hypr/wallpaper/wallpaper.jpg
# ═══════════════════════════════════════════════════════════════════════════

# Hyprland sürüm yazısını ("RIP hyprlang" gibi rastgele bir cümle) duvar
# kağıdının üzerine ÇİZME. Hyprland tarafındaki misc:disable_splash_rendering
# yalnızca Hyprland'in kendi zeminini kapsıyor; duvar kağıdının üstündeki yazıyı
# hyprpaper çiziyor ve onu ancak bu anahtar susturuyor.
splash = false

wallpaper {
    monitor  =
    path     = ~/.config/hypr/wallpaper/wallpaper.jpg
    fit_mode = cover
}
